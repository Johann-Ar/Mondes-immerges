<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>Documentaire · Mondes Immergés</title>
        <meta
            name="description"
            content="Un documentaire National Geographic à découvrir : le film, ses visages, ses images et comment agir."
        />
        <meta name="theme-color" content="#000000" />
        <link rel="icon" type="image/png" href="/favicon.png" />
        <link rel="preconnect" href="https://lumiere-a.akamaihd.net" />
        <script>
            try {
                if (sessionStorage.getItem('mi:transition'))
                    document.documentElement.classList.add('is-entering');
            } catch (e) {}
        </script>
        <link rel="stylesheet" href="/src/styles/base.css" />
        <link rel="stylesheet" href="/src/styles/film.css" />
        <script type="module" src="/src/pages/film.js"></script>
    </head>
    <body>
        <header class="bar" id="bar"></header>
        <nav class="dots" id="dots" aria-label="Sections du documentaire"></nav>
        <main id="page"></main>
        <dialog class="lightbox" id="lightbox" aria-label="Photo agrandie">
            <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Fermer">×</button>
            <button
                class="lightbox-arrow prev"
                id="lightbox-prev"
                type="button"
                aria-label="Photo précédente"
            >
                ←
            </button>
            <figure>
                <img id="lightbox-img" alt="" />
                <figcaption id="lightbox-caption"></figcaption>
            </figure>
            <button class="lightbox-arrow next" id="lightbox-next" type="button" aria-label="Photo suivante">
                →
            </button>
        </dialog>
    </body>
</html>
